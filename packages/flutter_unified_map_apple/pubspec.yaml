name: flutter_unified_map_apple
description: iOS and macOS implementation of flutter_unified_map on Apple MapKit (MKMapView).
version: 1.0.0
repository: https://github.com/AlphaByte/flutter_unified_map
issue_tracker: https://github.com/AlphaByte/flutter_unified_map/issues
topics:
  - maps
  - mapkit
  - map
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  latlong2: ">=0.9.1 <0.11.0"
  meta: ^1.17.0
  flutter_unified_map_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: 29.0.6

flutter:
  plugin:
    implements: flutter_unified_map
    platforms:
      ios:
        pluginClass: UnifiedMapsApplePlugin
        dartPluginClass: UnifiedMapsApple
        sharedDarwinSource: true
      macos:
        pluginClass: UnifiedMapsApplePlugin
        dartPluginClass: UnifiedMapsApple
        sharedDarwinSource: true
