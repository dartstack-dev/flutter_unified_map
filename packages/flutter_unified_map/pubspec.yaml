name: flutter_unified_map
description: Native maps for Flutter with a flutter_map-style API - Google Maps on Android, Apple MapKit on iOS and macOS, flutter_map on web and desktop. Markers, polylines, polygons, tiles.
version: 1.0.0
repository: https://github.com/dartstack-dev/flutter_unified_map
topics:
  - map
  - google-maps
  - mapkit
  - flutter-plugin
screenshots:
  - description: "The example app's stations scene on the iPhone simulator: 300 markers in one MarkerLayer, drawn natively over Apple MapKit"
    path: screenshots/stations.png
  - description: "The example app's Europe scene on the iPhone simulator: capital pins, routes and polygons over Apple MapKit"
    path: screenshots/europe.png
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.18.0
  dart_polylabel2: ^1.0.0
  flutter_map: ^8.3.1
  latlong2: ">=0.9.1 <0.11.0"
  meta: ^1.17.0
  flutter_unified_map_android: ^1.0.0
  flutter_unified_map_apple: ^1.0.0
  flutter_unified_map_flutter_map: ^1.0.0
  flutter_unified_map_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_unified_map_android
      ios:
        default_package: flutter_unified_map_apple
      macos:
        default_package: flutter_unified_map_apple
      web:
        default_package: flutter_unified_map_flutter_map
      windows:
        default_package: flutter_unified_map_flutter_map
      linux:
        default_package: flutter_unified_map_flutter_map
