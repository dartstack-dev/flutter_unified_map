name: flutter_unified_map_android
description: Android implementation of flutter_unified_map on the Google Maps SDK for Android.
version: 0.7.0
repository: https://github.com/AlphaByte/flutter_unified_map
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.28
  latlong2: ^0.9.1
  meta: ^1.17.0
  flutter_unified_map_platform_interface: ^0.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: 25.0.0

flutter:
  plugin:
    implements: flutter_unified_map
    platforms:
      android:
        package: dev.alphabyte.flutter_unified_map_android
        pluginClass: UnifiedMapsAndroidPlugin
        dartPluginClass: UnifiedMapsAndroid
