name: flutter_unified_map_platform_interface
description: Common platform interface for the flutter_unified_map plugin (native Google Maps on Android, MapKit on iOS/macOS, flutter_map elsewhere).
version: 1.0.0
repository: https://github.com/dartstack-dev/flutter_unified_map
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  latlong2: ">=0.9.1 <0.11.0"
  meta: ^1.17.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
