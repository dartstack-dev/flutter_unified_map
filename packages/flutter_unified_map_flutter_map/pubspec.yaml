name: flutter_unified_map_flutter_map
description: Pure Dart implementation of flutter_unified_map on flutter_map, used on web, Windows and Linux and in tests.
version: 1.0.0
repository: https://github.com/dartstack-dev/flutter_unified_map
issue_tracker: https://github.com/dartstack-dev/flutter_unified_map/issues
topics:
  - map
  - flutter-map
  - flutter-plugin
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  flutter_web_plugins:
    sdk: flutter
  flutter_unified_map_platform_interface: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_unified_map
    platforms:
      web:
        pluginClass: UnifiedMapsFlutterMap
        fileName: flutter_unified_map_flutter_map.dart
      windows:
        dartPluginClass: UnifiedMapsFlutterMap
      linux:
        dartPluginClass: UnifiedMapsFlutterMap
